<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
    <!-- Background Frame -->
    <rect x="25" y="25" width="450" height="350" rx="16" fill="#eef2ff"/>
    <rect x="25" y="25" width="450" height="350" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Top Bar -->
    <rect x="25" y="25" width="450" height="50" rx="16" fill="#ffffff"/>
    <rect x="25" y="50" width="450" height="25" fill="#ffffff"/>
    <circle cx="50" cy="50" r="6" fill="#ef4444"/>
    <circle cx="70" cy="50" r="6" fill="#f59e0b"/>
    <circle cx="90" cy="50" r="6" fill="#10b981"/>
    <rect x="120" y="42" width="260" height="16" rx="8" fill="#f1f5f9"/>
    
    <!-- Content Area Background -->
    <rect x="25" y="75" width="450" height="300" fill="#f8fafc" rx="0"/>
    
    <!-- Checklist -->
    <rect x="50" y="100" width="400" height="240" rx="12" fill="#ffffff" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.03))"/>
    
    <text x="80" y="140" font-family="sans-serif" font-weight="bold" font-size="18" fill="#111827">Today's Focus</text>
    <rect x="360" y="125" width="60" height="20" rx="10" fill="#7c3aed" opacity="0.1"/>
    <text x="370" y="140" font-family="sans-serif" font-weight="bold" font-size="11" fill="#7c3aed">3 Tasks</text>

    <!-- Item 1 -->
    <rect x="80" y="170" width="340" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="105" cy="190" r="8" fill="#10b981"/>
    <path d="M 101 190 L 104 193 L 109 187" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="125" y="195" font-family="sans-serif" font-size="14" fill="#94a3b8" text-decoration="line-through">Complete project proposal</text>
    
    <!-- Item 2 -->
    <rect x="80" y="225" width="340" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="105" cy="245" r="7" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <text x="125" y="250" font-family="sans-serif" font-weight="bold" font-size="14" fill="#111827">Design UI components</text>
    <rect x="340" y="235" width="60" height="20" rx="4" fill="#ef4444" opacity="0.1"/>
    <text x="350" y="249" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444">High</text>
    
    <!-- Item 3 -->
    <rect x="80" y="280" width="340" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="105" cy="300" r="7" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text x="125" y="305" font-family="sans-serif" font-size="14" fill="#64748b">Review pull requests</text>
</svg>
