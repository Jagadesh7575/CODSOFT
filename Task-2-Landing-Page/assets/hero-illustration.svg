<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
    <!-- Background -->
    <rect width="600" height="450" rx="16" fill="#eef2ff"/>
    
    <!-- Dashboard Container -->
    <rect x="40" y="40" width="520" height="370" rx="12" fill="#ffffff" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))"/>
    
    <!-- Sidebar -->
    <rect x="40" y="40" width="120" height="370" rx="12" fill="#f8fafc"/>
    <rect x="60" y="70" width="80" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="60" y="100" width="60" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="60" y="125" width="70" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="60" y="150" width="50" height="8" rx="4" fill="#e2e8f0"/>
    
    <!-- Main Content Area -->
    <!-- Header -->
    <rect x="190" y="70" width="150" height="16" rx="8" fill="#111827"/>
    <circle cx="510" cy="78" r="16" fill="#7c3aed"/>
    
    <!-- Progress Bar -->
    <rect x="190" y="120" width="340" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="190" y="120" width="200" height="8" rx="4" fill="#10b981"/>
    <text x="190" y="110" font-family="sans-serif" font-size="12" fill="#64748b">Weekly Progress</text>
    
    <!-- Task Cards -->
    <!-- Card 1 -->
    <rect x="190" y="160" width="160" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="210" cy="180" r="6" fill="#7c3aed"/>
    <rect x="230" y="176" width="80" height="8" rx="4" fill="#111827"/>
    <rect x="210" y="200" width="120" height="6" rx="3" fill="#94a3b8"/>
    <rect x="210" y="215" width="100" height="6" rx="3" fill="#94a3b8"/>
    
    <!-- Card 2 -->
    <rect x="370" y="160" width="160" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="390" cy="180" r="6" fill="#2563eb"/>
    <rect x="410" y="176" width="90" height="8" rx="4" fill="#111827"/>
    <rect x="390" y="200" width="110" height="6" rx="3" fill="#94a3b8"/>
    <rect x="390" y="215" width="80" height="6" rx="3" fill="#94a3b8"/>
    
    <!-- Goal Tracker / Calendar Block -->
    <rect x="190" y="280" width="340" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="210" y="300" width="100" height="12" rx="6" fill="#111827"/>
    
    <!-- Fake Chart/Blocks -->
    <rect x="210" y="330" width="30" height="30" rx="4" fill="#7c3aed" opacity="0.8"/>
    <rect x="250" y="330" width="30" height="30" rx="4" fill="#7c3aed" opacity="0.5"/>
    <rect x="290" y="330" width="30" height="30" rx="4" fill="#7c3aed" opacity="1.0"/>
    <rect x="330" y="330" width="30" height="30" rx="4" fill="#7c3aed" opacity="0.3"/>
    <rect x="370" y="330" width="30" height="30" rx="4" fill="#7c3aed" opacity="0.7"/>
    <rect x="410" y="330" width="30" height="30" rx="4" fill="#7c3aed" opacity="0.9"/>
    <rect x="450" y="330" width="30" height="30" rx="4" fill="#e2e8f0"/>
</svg>
