<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator | CODSOFT Task 3</title>
    <meta name="description" content="A responsive basic calculator built using HTML, CSS, and JavaScript for the CODSOFT Web Development Internship Level 1 Task 3.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Script -->
    <script src="script.js" defer></script>
</head>
<body>

    <main class="main-container">
        <header class="page-header">
            <h1>Basic Calculator</h1>
            <p>CODSOFT Web Development Internship – Level 1 Task 3</p>
        </header>

        <section class="calculator-wrapper">
            <div class="calculator">
                <div class="display">
                    <div class="previous-operand" id="previous-operand"></div>
                    <div class="current-operand" id="current-operand">0</div>
                </div>
                
                <div class="buttons-grid">
                    <button class="btn btn-clear" aria-label="Clear calculator" data-action="clear">AC</button>
                    <button class="btn btn-delete" aria-label="Delete last digit" data-action="delete">DEL</button>
                    <button class="btn btn-operator" aria-label="Percentage" data-action="percent">%</button>
                    <button class="btn btn-operator" aria-label="Divide" data-operator="÷">÷</button>
                    
                    <button class="btn btn-number" data-number="7">7</button>
                    <button class="btn btn-number" data-number="8">8</button>
                    <button class="btn btn-number" data-number="9">9</button>
                    <button class="btn btn-operator" aria-label="Multiply" data-operator="×">×</button>
                    
                    <button class="btn btn-number" data-number="4">4</button>
                    <button class="btn btn-number" data-number="5">5</button>
                    <button class="btn btn-number" data-number="6">6</button>
                    <button class="btn btn-operator" aria-label="Subtract" data-operator="−">−</button>
                    
                    <button class="btn btn-number" data-number="1">1</button>
                    <button class="btn btn-number" data-number="2">2</button>
                    <button class="btn btn-number" data-number="3">3</button>
                    <button class="btn btn-operator" aria-label="Add" data-operator="+">+</button>
                    
                    <button class="btn btn-number span-two" data-number="0">0</button>
                    <button class="btn btn-number" data-number=".">.</button>
                    <button class="btn btn-equals" aria-label="Calculate result" data-action="calculate">=</button>
                </div>
            </div>
        </section>

        <footer class="page-footer">
            <p>Built using HTML, CSS, and JavaScript.</p>
            <p>Created by Saanikommu Jagadeshwar Reddy</p>
        </footer>
    </main>

</body>
</html>
